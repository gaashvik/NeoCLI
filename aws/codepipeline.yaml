\nAWSTemplateFormatVersion: \'2010-09-09\'\nDescription: CloudFormation template for a CI/CD Pipeline using CodePipeline, CodeBuild, and S3 for the ETL application.\n\nParameters:\n  ProjectName:\n    Type: String\n    Default: MyETLApp\n    Description: Name of the project, used for resource naming.\n  RepositoryName:\n    Type: String\n    Description: The name of the CodeCommit repository.\n  BranchName:\n    Type: String\n    Default: feature/aws-etl-app\n    Description: The branch to use for the pipeline source.\n  ArtifactBucketName:\n    Type: String\    Description: S3 bucket to store CodePipeline artifacts. Must be globally unique.\n\nResources:\n  # S3 Bucket for CodePipeline Artifacts\n  CodePipelineArtifactBucket:\n    Type: AWS::S3::Bucket\n    Properties:\n      BucketName: !Ref ArtifactBucketName\n      VersioningConfiguration:\n        Status: Enabled\n      Tags:\n        - Key: Project\n          Value: !Ref ProjectName\n\n  # IAM Role for CodePipeline\n  CodePipelineServiceRole:\n    Type: AWS::IAM::Role\n    Properties:\n      AssumeRolePolicyDocument:\n        Version: \'2012-10-17\'\n        Statement:\n          - Effect: Allow\n            Principal:\n              Service:\n                - codepipeline.amazonaws.com\n            Action:\n              - sts:AssumeRole\n      Policies:\n        - PolicyName: CodePipelineAccess\n          PolicyDocument:\n            Version: \'2012-10-17\'\n            Statement:\n              - Effect: Allow\n                Action:\n                  - s3:GetObject\n                  - s3:PutObject\n                  - s3:GetBucketVersioning\n                  - s3:ListBucket\n                Resource:\n                  - !GetAtt CodePipelineArtifactBucket.Arn\n                  - !Join [ \"/\", [ !GetAtt CodePipelineArtifactBucket.Arn, \"*\" ] ]\n              - Effect: Allow\n                Action:\n                  - codecommit:GetBranch\n                  - codecommit:GetCommit\n                  - codecommit:UploadArchive\n                  - codecommit:GetUploadArchiveStatus\n                  - codecommit:GitPull\n                Resource:\n                  - !Sub \"arn:aws:codecommit:${AWS::Region}:${AWS::AccountId}:${RepositoryName}\"\n              - Effect: Allow\n                Action:\n                  - codebuild:StartBuild\n                  - codebuild:BatchGetBuilds\n                  - codebuild:StopBuild\n                Resource:\n                  - !GetAtt CodeBuildProject.Arn\n              - Effect: Allow\n                Action:\n                  - cloudformation:CreateStack\n                  - cloudformation:DeleteStack\n                  - cloudformation:UpdateStack\n                  - cloudformation:ValidateTemplate\n                  - cloudformation:GetTemplate\n                  - cloudformation:DescribeStacks\n                  - cloudformation:DescribeStackEvents\n                  - iam:PassRole # Required to pass the LambdaExecutionRole to CloudFormation\n                Resource: \"*\" # Limit this to specific stacks in a production environment\n\n  # IAM Role for CodeBuild\n  CodeBuildServiceRole:\n    Type: AWS::IAM::Role\n    Properties:\n      AssumeRolePolicyDocument:\n        Version: \'2012-10-17\'\n        Statement:\n          - Effect: Allow\n            Principal:\n              Service:\n                - codebuild.amazonaws.com\n            Action:\n              - sts:AssumeRole\n      ManagedPolicyArns:\n        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess\n        - arn:aws:iam::aws:policy/AmazonS3FullAccess # For simplicity, restrict in production\n      Policies:\n        - PolicyName: CodeBuildAccess\n          PolicyDocument:\n            Version: \'2012-10-17\'\n            Statement:\n              - Effect: Allow\n                Action:\n                  - s3:GetObject\n                  - s3:PutObject\n                  - s3:GetBucketVersioning\n                  - s3:ListBucket\n                Resource:\n                  - !GetAtt CodePipelineArtifactBucket.Arn\n                  - !Join [ \"/\", [ !GetAtt CodePipelineArtifactBucket.Arn, \"*\" ] ]\n              - Effect: Allow\n                Action:\n                  - cloudformation:ValidateTemplate\n                Resource: \"*\"\n\n  # CodeBuild Project\n  CodeBuildProject:\n    Type: AWS::CodeBuild::Project\n    Properties:\n      Name: !Sub \"${ProjectName}-CodeBuild\"\n      Description: CodeBuild project for the ETL application.\n      ServiceRole: !GetAtt CodeBuildServiceRole.Arn\n      Artifacts:\n        Type: CODEPIPELINE\n      Environment:\n        ComputeType: BUILD_GENERAL1_SMALL\n        Image: aws/codebuild/python:3.9\n        Type: LINUX_CONTAINER\n        EnvironmentVariables:\n          - Name: ARTIFACT_BUCKET\n            Value: !Ref CodePipelineArtifactBucket\n      Source:\n        Type: CODEPIPELINE\n        BuildSpec: aws/buildspec.yml # Reference to the buildspec.yml created earlier\n      Tags:\n        - Key: Project\n          Value: !Ref ProjectName\n\n  # CodePipeline\n  CodePipeline:\n    Type: AWS::CodePipeline::Pipeline\n    Properties:\n      Name: !Sub \"${ProjectName}-Pipeline\"\n      RoleArn: !GetAtt CodePipelineServiceRole.Arn\n      ArtifactStore:\n        Type: S3\n        Location: !Ref CodePipelineArtifactBucket\n      Stages:\n        - Name: Source\n          Actions:\n            - Name: Source\n              ActionTypeId:\n                Category: Source\n                Owner: AWS\n                Provider: CodeCommit\n                Version: \'1\'\n              Configuration:\n                RepositoryName: !Ref RepositoryName\n                BranchName: !Ref BranchName\n              OutputArtifacts:\n                - Name: SourceArtifact\n              RunOrder: 1\n        - Name: Build\n          Actions:\n            - Name: Build\n              ActionTypeId:\n                Category: Build\n                Owner: AWS\n                Provider: CodeBuild\n                Version: \'1\'\n              Configuration:\n                ProjectName: !Ref CodeBuildProject\n              InputArtifacts:\n                - Name: SourceArtifact\n              OutputArtifacts:\n                - Name: BuildArtifact\n              RunOrder: 1\n        - Name: Deploy\n          Actions:\n            - Name: DeployCloudFormation\n              ActionTypeId:\n                Category: Deploy\n                Owner: AWS\n                Provider: CloudFormation\n                Version: \'1\'\n              Configuration:\n                ActionMode: REPLACE_ON_FAILURE\n                StackName: !Sub \"${ProjectName}-ETL-Stack\"\n                TemplatePath: !Sub \"BuildArtifact::aws/packaged_template.yaml\"\n                Capabilities: [\"CAPABILITY_NAMED_IAM\"]\n                RoleArn: !GetAtt CodePipelineServiceRole.Arn # This role needs cloudformation permissions\n              InputArtifacts:\n                - Name: BuildArtifact\n              RunOrder: 1\n\nOutputs:\n  CodePipelineName:\n    Description: Name of the CodePipeline\n    Value: !Ref CodePipeline\n  CodeBuildProjectName:\n    Description: Name of the CodeBuild project\n    Value: !Ref CodeBuildProject\n  CodePipelineArtifactBucketName:\n    Description: Name of the S3 bucket used for CodePipeline artifacts\n    Value: !Ref CodePipelineArtifactBucket\n